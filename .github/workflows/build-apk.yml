# Builds an installable debug APK in the cloud on every push (no local Android setup needed).
# The APK is published on the repo's Releases page as "Latest build" — open that page on
# your phone and tap app-debug.apk to install.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          # Screenshot rendering lives in screenshots.yml; keep the APK build fast and offline-safe.
          ./gradlew testDebugUnitTest --tests "com.focusguard.app.BlockPolicyTest" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES="Debug build of ${GITHUB_SHA::7}. On your phone: download app-debug.apk, open it, allow 'Install unknown apps'."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK" --title "Latest build" --prerelease --notes "$NOTES"
          fi
