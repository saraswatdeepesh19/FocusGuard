# Renders the app's screens (with sample data) into docs/screenshots/*.png and commits
# them, so the README always shows the current UI. Runs when UI code or the
# screenshot test changes, or manually from the Actions tab.
name: README screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/com/focusguard/app/ui/**"
      - "app/src/test/java/com/focusguard/app/ui/ReadmeScreenshots.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads an Android runtime jar on first use; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-34

      - name: Render screenshots (retries once on network hiccups)
        run: |
          chmod +x gradlew
          render() {
            ./gradlew testDebugUnitTest --tests "com.focusguard.app.ui.ReadmeScreenshots" \
              -Proborazzi.test.record=true --stacktrace
          }
          render || { echo "Retrying in 20s..."; sleep 20; render; }

      - name: Commit updated screenshots
        run: |
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: update README screenshots"
            git pull --rebase
            git push
          fi
